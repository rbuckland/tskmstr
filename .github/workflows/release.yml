# Release pipeline.
#
# Versions are computed from conventional commits with convco (plain semver:
# feat -> minor, fix -> patch, `!`/BREAKING CHANGE -> major). On every push to
# `main` that contains a releasable commit, this workflow:
#   1. bumps Cargo.toml/Cargo.lock, commits `chore(release): vX.Y.Z` and tags it
#   2. builds the CLI (`tskmstr`) and the tray widget (`tskmstr-tray`) and
#      publishes installable packages for every platform:
#        macOS    tskmstr-<v>-macos-universal.dmg        (.app + CLI, universal binaries)
#        Linux    tskmstr_<v>_amd64.deb                  (Debian/Ubuntu)
#                 tskmstr_<v>_x86_64.apk                 (Alpine, musl build)
#                 tskmstr-<v>-linux-amd64.tar.gz
#                 tskmstr-<v>-linux-arm64-cli.tar.gz     (CLI only, cross-compiled)
#        Windows  tskmstr-<v>-windows-x64.msi            (per-user installer)
#                 tskmstr-<v>-windows-x64.zip
#        SHA256SUMS
#   3. creates the GitHub release that install.sh / install.ps1 look up.
#
# Docs/chore/ci-only pushes produce no release. A manually pushed `v*` tag or a
# workflow_dispatch (optionally with an explicit version) also releases.
# If branch protection stops the bot pushing the bump commit to main, the tag
# still points at a bump commit on top of main and the release proceeds; set a
# `RELEASE_TOKEN` secret (PAT with contents:write) to let it push to main.
#
# Packaging logic lives in packaging/ so it can be run locally.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z). Leave empty to compute it from conventional commits.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.47.0
  CONVCO_VERSION: 0.7.2

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    # the bump commit itself must not start another release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install convco
        run: |
          curl -fsSL "https://github.com/convco/convco/releases/download/v${CONVCO_VERSION}/convco-v${CONVCO_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "convco-v${CONVCO_VERSION}-x86_64-unknown-linux-musl/convco"
          convco --version
      - name: Determine version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          MODE=bump
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; MODE=tag
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            CURRENT="$(convco version)"
            VERSION="$(convco version --bump --treat-major-zero-as-stable)"
            if [[ "$VERSION" == "$CURRENT" ]]; then
              echo "No releasable commits since v$CURRENT - nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing v$VERSION ($MODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "release=true"     >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
      - name: Bump version, commit and tag
        if: steps.v.outputs.release == 'true' && steps.v.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          packaging/set-version.sh "$VERSION"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "tskmstr v$VERSION"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not push the version bump to main (branch protection?). Releasing from the tag anyway; set a RELEASE_TOKEN secret to fix this."
          fi
          git push origin "v$VERSION"

  linux:
    name: linux amd64 (deb, tgz)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK / AppIndicator development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - name: Set version
        run: packaging/set-version.sh "$VERSION"
      - name: Test
        run: cargo test --release --features tray
      - name: Build
        run: cargo build --release --features tray
      - name: Package
        run: |
          ./target/release/tskmstr-tray render-icon --out-dir "$PWD/assets"
          packaging/linux/build-packages.sh "$VERSION" amd64 "$PWD/target/release" "$PWD/assets" "$PWD/dist" deb tgz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*

  linux-arm64-cli:
    name: linux arm64 (CLI only, tgz)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - name: Set version
        run: packaging/set-version.sh "$VERSION"
      - name: Build (cross)
        run: cross build --release --target aarch64-unknown-linux-gnu --bin tskmstr
      - name: Package
        run: |
          PKG="tskmstr-${VERSION}-linux-arm64-cli"
          mkdir -p "stage/$PKG" dist
          cp target/aarch64-unknown-linux-gnu/release/tskmstr README.md LICENSE "stage/$PKG/"
          tar -C stage -czf "dist/$PKG.tar.gz" "$PKG"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-cli
          path: dist/*

  alpine:
    name: alpine x86_64 (apk)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # musl build of the GUI stack is the least battle-tested target: do not
    # block the release on it.
    continue-on-error: true
    container: rust:alpine
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install build dependencies
        run: |
          apk add --no-cache bash build-base musl-dev pkgconf curl tar git \
            openssl-dev gtk+3.0-dev libayatana-appindicator-dev xdotool-dev
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
      - name: Set version
        run: packaging/set-version.sh "$VERSION"
      - name: Build
        run: cargo build --release --features tray
      - name: Package
        run: |
          ./target/release/tskmstr-tray render-icon --out-dir "$PWD/assets"
          packaging/linux/build-packages.sh "$VERSION" amd64 "$PWD/target/release" "$PWD/assets" "$PWD/dist" apk
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-x86_64
          path: dist/*

  macos:
    name: macos universal (dmg)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Set version
        run: packaging/set-version.sh "$VERSION"
      - name: Test
        run: cargo test --release --features tray
      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --features tray --target aarch64-apple-darwin
          cargo build --release --features tray --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p bin
          for b in tskmstr tskmstr-tray; do
            lipo -create -output "bin/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            lipo -info "bin/$b"
          done
      - name: Package (.app + CLI in a DMG)
        run: |
          ./bin/tskmstr-tray render-icon --out-dir assets
          packaging/macos/build-app.sh "$VERSION" bin/tskmstr-tray bin/tskmstr assets/tskmstr.icns staging
          mkdir -p dist
          packaging/macos/build-dmg.sh staging "dist/tskmstr-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*

  windows:
    name: windows x64 (msi, zip)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version
        shell: bash
        run: packaging/set-version.sh "$VERSION"
      - name: Test
        run: cargo test --release --features tray
      - name: Build
        run: cargo build --release --features tray
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & .\target\release\tskmstr-tray.exe render-icon --out-dir assets
          wix build packaging\windows\tskmstr.wxs `
            -d "Version=$env:VERSION" -d "BinDir=target\release" -d "IcoFile=assets\tskmstr.ico" `
            -o "dist\tskmstr-$env:VERSION-windows-x64.msi"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target\release\tskmstr.exe, target\release\tskmstr-tray.exe, assets\tskmstr.ico, README.md, LICENSE stage\
          Copy-Item target\release\tskmstr.exe stage\t.exe
          Compress-Archive -Path stage\* -DestinationPath "dist\tskmstr-$env:VERSION-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*

  release:
    name: publish GitHub release
    needs: [version, linux, linux-arm64-cli, alpine, macos, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist && ls -la && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
