[package]
name = "tskmstr"
version = "0.7.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip="debuginfo"

[lib]
name = "tskmstr"
path = "src/lib.rs"

[[bin]]
name = "tskmstr"
path = "src/main.rs"

# Desktop tray/menu-bar widget. Build with: cargo build --features tray
[[bin]]
name = "tskmstr-tray"
path = "src/bin/tray/main.rs"
required-features = ["tray"]

[features]
default = []
tray = [
    "dep:eframe",
    "dep:winit",
    "dep:tray-icon",
    "dep:tiny-skia",
    "dep:ab_glyph",
    "dep:epaint_default_fonts",
    "dep:gtk",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1.0" , features = [ "derive"] }
serde_json = { version  = "1.0" }
tokio = { version = "1.47", features = ["full"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
shellexpand = "3.1.0"
anyhow = "1.0.75"
log = "0.4.20"
simple_logger = "5"
regex = "1.9.4"
lazy_static = "1.4.0"
either = "1.9.0"
colored = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde-inline-default = "1.0.2"
base64 = "0.23"

# --- tray widget (optional, feature = "tray") ---------------------------------
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
winit = { version = "0.30", optional = true, default-features = false }
tray-icon = { version = "0.25", optional = true }
tiny-skia = { version = "0.12", optional = true }
ab_glyph = { version = "0.2", optional = true }
epaint_default_fonts = { version = "0.36", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# macOS: NSScreen lookup so the panel lands under the icon on mixed-DPI multi-monitor setups
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSGeometry"] }
